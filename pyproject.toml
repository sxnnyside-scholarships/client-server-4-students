[project]
name = "cs4s"
version = "2.1.0"
description = "Client-Server 4 Students: Educational networking laboratory"
readme = "README.md"
requires-python = ">=3.11, <3.16"
authors = [
    { name = "HoujouSxnnyside", email = "houjou.sxnnyside@sxnnysideproject.com" },
]
dependencies = [
    "PyQt6>=6.6.0",
    "bcrypt>=4.1.0",
    "python-i18n>=0.3.9",
    "cryptography>=42.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyinstaller>=6.6.0",
    "pre-commit>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["src.ui.*", "tests.*"]
ignore_errors = true
